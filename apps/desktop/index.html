<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VluxChart DeepChart — Nền tảng phân tích dòng lệnh Order Flow, Cluster Footprint, Options GEX và kết nối giao dịch định chế."
    />
    <meta name="theme-color" content="#0B0F15" />
    <title>VluxChart · DeepChart Desktop Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --vlx-bg: #0B0F15;
        --vlx-surface: #0F141D;
        --vlx-panel: #131823;
        --vlx-border: #222B3B;
        --vlx-ink: #E2E8F0;
        --vlx-muted: #8E9BAE;
        --vlx-bid: #089981;
        --vlx-ask: #F23645;
        --vlx-accent: #38BDF8;
        --vlx-amber: #F59E0B;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--vlx-bg);
        color: var(--vlx-ink);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Custom Dark Institutional Scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0D1118;
      }
      ::-webkit-scrollbar-thumb {
        background: #263042;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38465E;
      }
      /* Tactile Hover, Press & Keyboard Focus Layer */
      button:not(:disabled),
      select {
        transition:
          background-color 0.14s ease,
          border-color 0.14s ease,
          color 0.14s ease,
          filter 0.14s ease,
          transform 0.08s ease;
      }
      button:not(:disabled):hover {
        filter: brightness(1.09);
      }
      button:not(:disabled):active {
        transform: translateY(1px);
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 1.5px solid var(--vlx-accent);
        outline-offset: 1px;
      }
      /* Tabular lining figures so live ticking prices/volumes never jitter */
      .font-mono-numbers,
      .tabular-nums,
      code,
      pre,
      table,
      td,
      th,
      input[type='number'] {
        font-variant-numeric: tabular-nums;
      }
      /* Responsive Login Launcher Layout */
      @media (max-width: 780px) {
        .vlx-login-shell {
          grid-template-columns: 1fr !important;
          max-height: 94vh;
          overflow-y: auto !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
