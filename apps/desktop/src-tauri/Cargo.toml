[package]
name = "deepchart-desktop"
version = "0.1.0"
description = "DeepChart Windows Desktop Order Flow Analytics"
authors = ["DeepChart Core Team"]
license = "Proprietary"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
app-service = { path = "../../../crates/app-service" }
data-contract = { path = "../../../crates/data-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
