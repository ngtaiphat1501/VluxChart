[package]
name = "deepchart-desktop"
version = "0.1.0"
description = "DeepChart Windows Desktop Order Flow Analytics"
authors = ["DeepChart Core Team"]
license = "Proprietary"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
app-service = { path = "../../../crates/app-service" }
chrono = { version = "0.4", features = ["serde"] }
data-contract = { path = "../../../crates/data-contract" }
dirs = "7.0"
flate2 = "1.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.29", features = ["v4"] }
volume-engine = { path = "../../../crates/volume-engine" }

[profile.release]
strip = true
