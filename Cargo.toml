[workspace]
resolver = "2"
members = [
    "crates/data-contract",
    "crates/volume-engine",
    "crates/data-quality",
    "crates/raw-journal",
    "crates/feed-adapters",
    "crates/app-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DeepChart Core Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = { version = "1.0" }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
crc32fast = "1.4"
